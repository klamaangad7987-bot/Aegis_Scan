name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── 1. Tests unitaires ─────────────────────────────────────────────────
  test:
    name: Tests & Couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Lancer les tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
        env:
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key

      - name: Upload rapport couverture
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  # ── 2. Analyse SAST (Bandit) ──────────────────────────────────────────
  sast:
    name: Analyse SAST — Bandit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Installer Bandit
        run: pip install bandit[toml]

      - name: Scan SAST
        run: |
          bandit -r app/ -f json -o bandit-report.json --severity-level medium || true

      - name: Upload rapport Bandit
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── 3. Scan dépendances (Safety) ──────────────────────────────────────
  dependency-check:
    name: Scan Dépendances — Safety
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Installer Safety
        run: pip install safety

      - name: Vérifier les CVE
        run: |
          safety check -r requirements.txt --json > safety-report.json || true

      - name: Upload rapport Safety
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

  # ── 4. Build image Docker ─────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ sast, dependency-check ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devsecops-platform:latest
            ${{ secrets.DOCKER_USERNAME }}/devsecops-platform:${{ github.sha }}

  # ── 5. Scan image Docker (Trivy) ──────────────────────────────────────
  image-scan:
    name: Scan Image — Trivy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/devsecops-platform:latest
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
